<div class="login-container">
  <form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="submitForm()">
    <!-- 品牌标识 -->
    <div class="brand-section">
      <div class="brand-logo">✈️</div>
      <div class="brand-name">AIRLINE ORDER SYSTEM</div>
    </div>
    
    <h2 class="login-title">系统登录</h2>
    
    <nz-form-item>
      <nz-form-control nzErrorTip="请输入用户名!">
        <nz-input-group nzPrefixIcon="user">
          <input type="text" nz-input formControlName="username" placeholder="用户名" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>
    
    <nz-form-item>
      <nz-form-control nzErrorTip="请输入密码!">
        <nz-input-group nzPrefixIcon="lock">
          <input type="password" nz-input formControlName="password" placeholder="密码" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>
    
    <button nz-button class="login-form-button" [nzType]="'primary'" [nzLoading]="isLoading">
      {{ isLoading ? '登录中...' : '登 录' }}
    </button>
    
    <!-- 提示信息 -->
    <div style="text-align: center; margin-top: 24px; color: #64748b; font-size: 12px;">
      提示：使用 admin / password 登录
    </div>
  </form>
</div>
